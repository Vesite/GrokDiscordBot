[project]
name = "grokdiscordbot"
version = "0.1.0"
description = "Discord bot made with python using xAI API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "pillow>=11.0.0",
]

[tool.uv]
# The uv cache is on C: and this project is on D:. Windows cannot hardlink
# across volumes, so uv tries, fails, and warns on every command. Copying is
# what it falls back to anyway, so ask for it directly.
link-mode = "copy"
